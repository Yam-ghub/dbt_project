name: data_pipeline

profile: data_pipeline

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  data_pipeline:
    +schema: raw

models:
  data_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: table